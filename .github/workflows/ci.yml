name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck, build and schema integrity
    runs-on: ubuntu-latest

    # The migrations only fail in the ways that matter against a real
    # Postgres — a NOT NULL column, a CHECK constraint, a foreign key. There
    # is nothing useful to assert without one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # 22 rather than the newest: `package.json` pins `<23`, and the suite
      # imports TypeScript through Node's own type stripping, which 20 does
      # not have.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs `scripts/migrate.mjs` the way the deploy does, then checks the
      # app still reads — and that no DDL has crept back into the request
      # path, which is what made a schema mistake a public 500 last time.
      - name: Schema integrity
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salt_test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
